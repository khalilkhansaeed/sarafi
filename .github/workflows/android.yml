name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      native:
        description: "Native/plugin change? (true = bump versionCode + require APK install)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Verify bundled vendor libraries are intact
        run: |
          set -e
          for f in www/vendor/pdf-lib.min.js www/vendor/fontkit.umd.min.js; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 200000 ]; then
              echo "ERROR: $f looks truncated ($size bytes)"
              exit 1
            fi
            node --check "$f"
          done
          node -e "const s=require('fs').readFileSync('www/vendor/pdf-lib.min.js','utf8'); if(!/PDFLib/.test(s)){console.error('ERROR: pdf-lib missing PDFLib global');process.exit(1)}"
          echo "Vendor libraries intact."

      - name: Decide version numbers (native vs web-only)
        id: ver
        run: |
          set -e
          # Did this push touch native code? If so, users MUST install a new APK.
          NATIVE_CHANGED="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NATIVE_CHANGED="${{ github.event.inputs.native }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              NATIVE_CHANGED="true"
            else
              CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" || true)
              if echo "$CHANGED" | grep -E '^(android/|package\.json$|package-lock\.json$|capacitor\.config\.json$)' >/dev/null; then
                NATIVE_CHANGED="true"
              fi
            fi
          fi

          # Reuse the previous release's versionCode for web-only changes so the
          # APK does not need reinstalling; bump it for native changes.
          PREV_JSON=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/version.json" || true)
          PREV_CODE=$(echo "$PREV_JSON" | grep -o '"versionCode"[^,]*' | grep -o '[0-9]*' | head -1 || true)

          BASE_CODE=$((10000 + ${{ github.run_number }}))
          if [ "$NATIVE_CHANGED" = "true" ]; then
            if [ -n "$PREV_CODE" ] && [ "$PREV_CODE" -ge "$BASE_CODE" ]; then
              VERSION_CODE=$((PREV_CODE + 1))
            else
              VERSION_CODE=$BASE_CODE
            fi
          else
            if [ -n "$PREV_CODE" ]; then VERSION_CODE=$PREV_CODE; else VERSION_CODE=$BASE_CODE; fi
          fi

          WEB_VERSION="1.0.${{ github.run_number }}"
          VERSION_NAME="$WEB_VERSION"

          echo "NATIVE_CHANGED=$NATIVE_CHANGED"
          echo "PREV_CODE=$PREV_CODE"
          echo "VERSION_CODE=$VERSION_CODE"
          echo "WEB_VERSION=$WEB_VERSION"
          echo "NATIVE_CHANGED=$NATIVE_CHANGED" >> "$GITHUB_ENV"
          echo "SARAFI_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SARAFI_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "SARAFI_WEB_VERSION=$WEB_VERSION" >> "$GITHUB_ENV"

      - name: Build web assets
        run: npm run build:www

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Verify required vendor assets are bundled
        run: |
          set -e
          ASSETS=android/app/src/main/assets/public
          for f in vendor/pdf-lib.min.js vendor/fontkit.umd.min.js vendor/firebase-app-compat.js vendor/firebase-auth-compat.js vendor/firebase-firestore-compat.js fonts.css index.html; do
            if [ ! -f "$ASSETS/$f" ]; then
              echo "ERROR: missing bundled asset: $f"
              exit 1
            fi
          done
          if grep -q "cdn.jsdelivr.net/npm/pdf-lib" "$ASSETS/index.html"; then
            echo "ERROR: index.html still references remote pdf-lib CDN"
            exit 1
          fi
          if grep -q "cdn.jsdelivr.net/npm/@pdf-lib/fontkit" "$ASSETS/index.html"; then
            echo "ERROR: index.html still references remote fontkit CDN"
            exit 1
          fi
          if ! grep -q "vendor/pdf-lib.min.js?v=" "$ASSETS/index.html"; then
            echo "ERROR: pdf-lib vendor URL is not cache-busted"
            exit 1
          fi
          if ! grep -q "vendor/fontkit.umd.min.js?v=" "$ASSETS/index.html"; then
            echo "ERROR: fontkit vendor URL is not cache-busted"
            exit 1
          fi
          if grep -q "const id=(BUILD_ID&&BUILD_ID" "$ASSETS/index.html"; then
            echo "ERROR: build-stamp guard still contains a corruptible BUILD_ID literal"
            exit 1
          fi
          echo "All required vendor assets present, CDN URLs rewritten and cache-busted."

      - name: Verify native PDF share plugins are registered
        run: |
          set -e
          ASSETS=android/app/src/main/assets/public
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          for p in "@capacitor/filesystem" "@capacitor/share"; do
            if ! grep -q "$p" "$PLUGINS"; then
              echo "ERROR: native plugin not registered: $p (PDF save/share will fail)"
              exit 1
            fi
          done
          if ! grep -q "nativePromise" "$ASSETS/index.html"; then
            echo "ERROR: index.html does not use the native bridge for PDF delivery"
            exit 1
          fi
          echo "PDF Filesystem/Share plugins registered and used."

      - name: Verify updater wiring
        run: |
          set -e
          # OTA web updater plugin must be registered natively
          if ! grep -q "@capgo/capacitor-updater" android/app/src/main/assets/capacitor.plugins.json; then
            echo "ERROR: @capgo/capacitor-updater not registered (OTA web updates disabled)"
            exit 1
          fi
          # anti-rollback signal must be present in the shipped bundle
          if ! grep -q "notifyAppReady" android/app/src/main/assets/public/index.html; then
            echo "ERROR: index.html missing notifyAppReady (Capgo will roll back OTA updates)"
            exit 1
          fi
          # our in-app APK installer plugin + install permission
          test -f android/app/src/main/java/com/sarafi/app/ApkInstallerPlugin.java \
            || { echo "ERROR: ApkInstallerPlugin.java missing"; exit 1; }
          grep -q "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml \
            || { echo "ERROR: REQUEST_INSTALL_PACKAGES permission missing"; exit 1; }
          echo "Updater wiring verified."

      - name: Verify web version placeholder was stamped
        run: |
          set -e
          if grep -q "__WEB_VERSION__" android/app/src/main/assets/public/index.html; then
            echo "ERROR: __WEB_VERSION__ placeholder was not replaced"
            exit 1
          fi
          echo "Web version stamped: $SARAFI_WEB_VERSION"

      - name: Decode release keystore
        run: |
          set -e
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/sarafi-release.jks"
            echo "SARAFI_KEYSTORE_PATH=$RUNNER_TEMP/sarafi-release.jks" >> "$GITHUB_ENV"
            echo "SARAFI_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SARAFI_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SARAFI_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Release signing key loaded."
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not set; the release APK will be debug-signed and in-place updates will NOT work."
          fi

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package release assets (APK + web zip + version.json)
        run: |
          set -e
          mkdir -p dist
          SRC=android/app/build/outputs/apk/release/app-release.apk
          cp "$SRC" dist/sarafi-app-release.apk

          APK_SHA=$(sha256sum dist/sarafi-app-release.apk | cut -d' ' -f1)
          (cd www && zip -r -q ../dist/sarafi-web.zip .)
          WEB_SHA=$(sha256sum dist/sarafi-web.zip | cut -d' ' -f1)

          COMMIT="${GITHUB_SHA:0:7}"
          NOTES="${COMMIT}"
          if [ "${NATIVE_CHANGED}" = "true" ]; then NOTES="native ${COMMIT}"; fi

          cat > dist/version.json <<EOF
          {
            "versionCode": ${SARAFI_VERSION_CODE},
            "versionName": "${SARAFI_VERSION_NAME}",
            "webVersion": "${SARAFI_WEB_VERSION}",
            "webName": "sarafi-web.zip",
            "apkName": "sarafi-app-release.apk",
            "apkSha256": "${APK_SHA}",
            "webSha256": "${WEB_SHA}",
            "nativeChanged": ${NATIVE_CHANGED},
            "notes": "${NOTES}"
          }
          EOF

          echo "---- version.json ----"
          cat dist/version.json
          echo "----------------------"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sarafi-app-release
          path: |
            dist/sarafi-app-release.apk
            dist/sarafi-web.zip
            dist/version.json

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Sarafi build
          body: |
            Automatic build for commit ${{ github.sha }}.
            native/changed: ${{ env.NATIVE_CHANGED }}
            webVersion: ${{ env.SARAFI_WEB_VERSION }}
            versionCode: ${{ env.SARAFI_VERSION_CODE }}
          make_latest: true
          files: |
            dist/sarafi-app-release.apk
            dist/sarafi-web.zip
            dist/version.json
