name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:www

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Verify required vendor assets are bundled
        run: |
          set -e
          ASSETS=android/app/src/main/assets/public
          for f in vendor/pdf-lib.min.js vendor/fontkit.umd.min.js vendor/firebase-app-compat.js vendor/firebase-auth-compat.js vendor/firebase-firestore-compat.js fonts.css index.html; do
            if [ ! -f "$ASSETS/$f" ]; then
              echo "ERROR: missing bundled asset: $f"
              exit 1
            fi
          done
          if grep -q "cdn.jsdelivr.net/npm/pdf-lib" "$ASSETS/index.html"; then
            echo "ERROR: index.html still references remote pdf-lib CDN"
            exit 1
          fi
          if grep -q "cdn.jsdelivr.net/npm/@pdf-lib/fontkit" "$ASSETS/index.html"; then
            echo "ERROR: index.html still references remote fontkit CDN"
            exit 1
          fi
          echo "All required vendor assets present and CDN URLs rewritten."

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarafi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
